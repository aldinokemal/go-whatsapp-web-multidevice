services:
  - type: web
    name: wtf
    runtime: docker
    dockerfilePath: ./docker/golang.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /app/storages
      sizeGB: 1
    envVars:
      - key: APP_PORT
        value: "10000"
      - key: WTF_MULTIUSER
        value: "true"
      - key: WTF_SIGNUP_OPEN
        value: "false"
      # Server-wide cap on linked numbers: Aryeh sets the measured value.
      - key: WTF_MAX_PHONES
        sync: false
      - key: WTF_DEFAULT_MAX_DEVICES
        value: "2"
      - key: WTF_PRODUCT_NAME
        value: WTF
      - key: SESSION_SECRET
        generateValue: true
      - key: WTF_SUPERADMIN_PHONES
        sync: false
      # MCP for Claude, per person (OAuth issuer and resource derive from
      # RENDER_EXTERNAL_URL, or WTF_PUBLIC_URL when set for a custom domain).
      - key: WTF_MCP_ENABLED
        value: "true"
      # Only Claude's apps may connect (claude.ai, desktop, phone, Claude Code).
      - key: WTF_MCP_CLIENT_HOSTS
        value: claude.ai
