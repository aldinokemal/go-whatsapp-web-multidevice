{{define "verify.html"}}{{template "head" .}}
<main id="main" tabindex="-1" class="page page-centered">
  <div class="card card-auth">
  {{if .Data.Valid}}
    <h1>Sign in to {{.Product}}</h1>
    <p>Confirm you want to sign in.</p>
    <form method="post" action="/signin/verify">
      <input type="hidden" name="t" value="{{.Data.Token}}">
      <input type="hidden" name="next" value="{{.Data.Next}}">
      <p class="action-group">
        <button type="submit" class="btn btn-primary">Sign in</button>
      </p>
    </form>
  {{else}}
    <h1>Link expired</h1>
    <p>This sign-in link has already been used or has expired. Send us the message again for a new one.</p>
    <p class="action-group"><a class="btn btn-secondary" href="/signin">Back to sign in</a></p>
  {{end}}
  </div>
</main>
{{template "foot" .}}{{end}}
